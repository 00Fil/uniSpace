<a class="skip" href="#tools">Vai ai tool</a>
<header class="top" id="top">

    <button class="nsearch" id="nsearch" type="button" tabindex="-1" aria-label="Cerca un tool"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span>Cerca un tool</span><kbd class="kh">Ctrl K</kbd></button>
    <div class="guest" id="acctIn" hidden><a class="k-btn ghost" href="/account/login">Accedi</a><a class="k-btn" href="/account/login?m=signup">Crea account</a></div>

        <g class="cross"><path d="M250 694v24M238 706h24"/><path d="M950 694v24M938 706h24"/><path d="M600 700v12"/></g>
      </svg>
      <div class="glow" aria-hidden="true"></div>
      <div class="tiles" id="tiles" aria-hidden="true"></div>

        <button class="hsearch rv" id="hsearch" type="button">

    <div class="sec-head">
      <span class="k-chip"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="28" fill="url(#klogo)"/><g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="8"><path d="M24 44C27 54 39 54 42 44M58 44C61 54 73 54 76 44"/><path d="M40 67C44 73 56 73 60 67"/></g></svg>Tutti i tool</span>

  </section>

<footer class="foot wrap">
  <a class="k-logo" href="#"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="28" fill="url(#klogo)"/><g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="8"><path d="M24 44C27 54 39 54 42 44M58 44C61 54 73 54 76 44"/><path d="M40 67C44 73 56 73 60 67"/></g></svg><b>StudyKit</b></a>

      <p class="pal-hint" id="palHint"></p>

  </div>
</div>
