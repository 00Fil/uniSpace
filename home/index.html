<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>StudyKit · Tutto per l’uni, zero sbatti</title>
<meta name="description" content="Tool gratuiti per studenti universitari, tutti in un posto.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%227%22 fill=%22%23eee%22/%3E%3Cpath d=%22M7 7h4v4H7zM13 7h4v4h-4zM7 13h4v4H7z%22 fill=%22%23000%22/%3E%3Cpath d=%22M13 13h4v4h-4z%22 fill=%22%23000%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="home.css">
</head>
<body>
<canvas id="heroFx" aria-hidden="true"></canvas>

<header class="top" id="top">
  <a class="logo" href="#"><span class="mark"><i></i><i></i><i></i><i class="d"></i></span>StudyKit</a>
  <button class="nsearch" id="nsearch" type="button" tabindex="-1" aria-label="Cerca un tool"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span>Cerca un tool</span><kbd class="kh">Ctrl K</kbd></button>
  <a class="acct-in" id="acctIn" href="/account/login" hidden>Accedi</a>
  <div class="acct" id="acct" hidden>
    <button class="acct-b" id="acctB" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Il tuo account"><span id="acctI"></span></button>
    <div class="acct-m" id="acctM" role="menu" hidden>
      <div class="acct-h"><span class="acct-av" id="acctAv"></span><div><b id="acctN"></b><small>Account StudyKit</small></div></div>
      <div class="acct-s"><div class="acct-st"><span>Il tuo spazio</span><span id="acctU"></span></div><div class="acct-bar"><i id="acctBar"></i></div>
        <p>Vale per tutti i tool: i tuoi video e i tuoi file li vedi solo tu.</p></div>
      <a class="acct-x" href="/account/" role="menuitem"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg>Profilo e spazio</a>
      <button class="acct-x" id="acctOut" type="button" role="menuitem"><svg viewBox="0 0 24 24"><path d="M14 4h3.5A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5H14M10 16l-4-4 4-4M6 12h10"/></svg>Esci</button>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="hero-in">
      <h1><span>Tutto per l’uni,</span> <span>zero sbatti.</span></h1>
      <p class="lead" id="lead"></p>
      <button class="hsearch" id="hsearch" type="button" aria-label="Cerca un tool">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <span class="hs-l">Cerca un tool</span>
        <span class="tick" aria-hidden="true"><span class="tick-t" id="tick"></span></span>
        <kbd class="kh">Ctrl K</kbd>
      </button>
    </div>
  </section>

</main>

<div class="pal" id="pal" hidden role="dialog" aria-modal="true" aria-label="Cerca un tool">
  <div class="pal-bg"></div>
  <button class="pal-x" id="palX" type="button" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="pal-sc" id="palSc">
    <div class="pal-head" id="palHead">
      <label class="pal-in" id="palIn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input id="pq" placeholder="Nome, formato o cosa devi fare" autocomplete="off" spellcheck="false" enterkeyhint="go"><kbd>Esc</kbd></label>
      <p class="pal-hint" id="palHint"></p>
    </div>
    <div class="pal-list" id="pList"></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script src="fx.js"></script>
<script src="fx2.js"></script>
<script type="module" src="home.js"></script>
</body>
</html>
